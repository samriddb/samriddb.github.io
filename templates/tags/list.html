{% extends "base.html" %}
{% block title %}Tags · Samriddhi Bhardwaj{% endblock title %}
{% block content %}
  <header>
    <div>
      <h1>Tags</h1>
    </div>
    <nav>
      <a href="/">About</a>
      <a href="/blog/">Blog</a>
      <a href="/resume.pdf">Resume</a>
    </nav>
  </header>

  <main>
    <div class="tag-filter">
      {% for term in terms %}
        <a class="tag-pill" href="{{ term.permalink }}">#{{ term.name }} ({{ term.pages | length }})</a>
      {% endfor %}
    </div>
  </main>

  <footer>
    Made with <a href="https://www.getzola.org/">Zola</a>.
  </footer>

  <style>
    .tag-filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-pill {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-dim); padding: 5px 12px; border-radius: 999px;
      text-decoration: none;
    }
    .tag-pill:hover { color: var(--accent); border-color: var(--accent); }
  </style>
{% endblock %}
