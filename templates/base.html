<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Samriddhi{% endblock title %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f7f3;
      --bg-elevated: #f1eeea;
      --text: #1a2818;
      --text-dim: #607058;
      --accent: #8c3050;
      --status-on: #5a7d4f;
      --status-off: #8c3050;
      --border: #e2dcd4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }

    .wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 56px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
      margin: 0;
    }

    header .pronunciation {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 0.3rem;
    }

    nav {
      padding-top: 0.4rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    nav a:hover, nav a.active { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    p { margin-bottom: 1rem; }

    h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin: 1.75rem 0 0.6rem;
      position: relative;
    }

    h2:first-of-type { margin-top: 0.5rem; }

    .photo {
      float: left;
      shape-outside: circle(50%);
      shape-margin: 1rem;
      margin: 0.25rem 2rem 1rem 0;
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* shared components: chips, tags, cards -- reused across blog/tag/homelab pages */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 4px 10px; border-radius: 4px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-on { background: var(--status-on); }
    .dot-off { background: var(--status-off); }

    .meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--accent);
      text-decoration: none;
    }
    .tag::before { content: "#"; }
    .tag:hover { text-decoration: underline; }

    .card {
      border-top: 1px solid var(--border);
      padding: 22px 0;
    }
    .card h3 { margin: 0 0 6px; font-family: 'Source Serif 4', serif; font-size: 20px; font-weight: 600; }
    .card h3 a { color: var(--text); }
    .card h3 a:hover { color: var(--accent); }
    .card p { margin: 0 0 8px; color: var(--text-dim); font-size: 15px; }
    .card p:last-child { margin-bottom: 0; }
    .card .tags { margin-top: 6px; }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 0.5rem; }
      nav { padding-top: 0; flex-wrap: wrap; }
    }

    .heading-anchor {
      position: absolute;
      left: -0.9em;
      top: 0;
      visibility: hidden;
      color: var(--text-dim);
      text-decoration: none;
      font-weight: normal;
      font-size: 1em;
    }
    h1:hover .heading-anchor,
    h2:hover .heading-anchor,
    h3:hover .heading-anchor { visibility: visible; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <script>
    document.querySelectorAll('h1[id], h2[id], h3[id]').forEach(h => {
      const a = document.createElement('a');
      a.className = 'heading-anchor';
      a.href = '#' + h.id;
      a.textContent = '#';
      h.prepend(a);
      h.style.cursor = 'pointer';
      h.addEventListener('click', e => {
        if (e.target === a) return;
        window.location.hash = h.id;
        navigator.clipboard.writeText(window.location.href).catch(() => {});
      });
    });
  </script>
</body>
</html>
